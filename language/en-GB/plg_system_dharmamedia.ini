PLG_SYSTEM_DHARMAMEDIA_PATH_DESC="<strong>Available shortcodes</strong><br><code>{year}</code>, <code>{month}</code>, <code>{day}</code> use the upload date.<br><code>{author}</code> is the record author ID (your ID for a new record). <code>{user}</code> is the uploader ID.<br><code>{component}</code> is the component, such as <code>com_content</code>. <code>{field}</code> is the field, such as <code>image_intro</code>.<br>For example, <code>Site photos/{year}/{month}/{author}</code> creates <code>Site photos/2026/11/42</code>.<br>Leave this field empty to upload to the base folder."
